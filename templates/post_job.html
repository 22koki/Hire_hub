{% extends "base.html" %}{% block title %}Post a job — Hire Hub{% endblock %}{% block content %}<section class="form-page container"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><div class="eyebrow">GROW YOUR TEAM</div><h1>Post an opportunity</h1><p class="muted">Share the role, find the right people, and build something great.</p><form method="post" class="panel form-stack"><div class="form-grid"><label>Job title *<input name="title" required placeholder="e.g. Product Designer"></label><label>Company *<input name="company" required placeholder="Company name"></label><label>Location *<input name="location" required placeholder="e.g. Nairobi, Kenya"></label><label>Category<input name="category" placeholder="e.g. Technology"></label><label>Employment type<select name="job_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Freelance</option></select></label><label>Work arrangement<select name="workplace"><option>Hybrid</option><option>Remote</option><option>On-site</option></select></label><label class="full-span">Salary range<input name="salary" placeholder="e.g. KES 80,000 – 120,000 / month"></label><label class="full-span">Role description *<textarea name="description" rows="7" required placeholder="Describe the role, responsibilities and impact..."></textarea></label><label class="full-span">Requirements<textarea name="requirements" rows="5" placeholder="Skills, experience and qualifications..."></textarea></label></div><button class="btn">Publish job listing →</button></form></section>{% endblock %}
